device:
  device_id: edge_ai_001

model:
  model_path: runs/detect/helmet_final/weights/best.onnx
  input_size: 640
  class_names:
    - helmet
    - no_helmet

video:
  streams:
    - camera_id: cam_01
      camera_name: entrance
      url: http://192.168.1.124:4747/mjpegfeed
      enabled: true

    - camera_id: cam_02
      camera_name: workshop
      url: rtsp://user:password@192.168.1.120:554/stream1
      enabled: false

detect:
  conf_threshold: 0.25
  iou_threshold: 0.45

alarm:
  alarm_class_name: no_helmet
  alarm_cooldown: 3
  alarm_confirm_frames: 1
  alarm_dir: alarm_results
  alarm_log_file: alarm_log.jsonl

mqtt:
  enable: true
  broker_host: broker.emqx.io
  broker_port: 1883
  topic: edge_ai/miaoqinfang/device001/alarm

dashboard:
  host: 0.0.0.0
  port: 5000
  auto_refresh_seconds: 5

database:
  enable: true
  db_path: alarm_records.db